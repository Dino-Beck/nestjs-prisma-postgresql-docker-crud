services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: yourusername
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: yourdatabase
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - prisma-network

  app:
    build:
      context: ./example-crud-product/example-crud-product
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "3000:3000"
    networks:
      - prisma-network

volumes:
  db-data:

networks:
  prisma-network:
    driver: bridge